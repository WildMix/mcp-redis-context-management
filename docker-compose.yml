# Redis Stack: Redis + the Query Engine (RediSearch: FT.CREATE, vector KNN) + RedisInsight.
# Ports are bound to loopback only: there is no password, so nothing outside this machine may reach it.
services:
  redis:
    image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
    container_name: project-memory-redis
    restart: unless-stopped
    # One container needs no network of its own; Docker's default bridge also avoids "all predefined
    # address pools have been fully subnetted" when VPN routes cover Docker's address pools.
    network_mode: bridge
    ports:
      - "127.0.0.1:6379:6379"   # Redis / RediSearch
      - "127.0.0.1:8001:8001"   # RedisInsight browser UI: http://localhost:8001
    environment:
      # Survive restarts: append-only file, plus a snapshot each minute when anything changed
      REDIS_ARGS: "--appendonly yes --save 60 1"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
