# Two independent persistence/export boundaries, both using database 0.
services:
  work:
    image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
    container_name: project-memory-work-redis
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:6380:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1"
    volumes:
      - work-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  personal:
    image: redis/redis-stack@sha256:5d5154123426693540ea6c1d9e638eae2bf2024879c839db6fcfdd7717e817c7
    container_name: project-memory-personal-redis
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "127.0.0.1:6381:6379"
    environment:
      REDIS_ARGS: "--appendonly yes --save 60 1"
    volumes:
      - personal-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  work-data:
  personal-data:
